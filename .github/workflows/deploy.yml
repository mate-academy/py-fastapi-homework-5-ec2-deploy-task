name: CD Pipeline

on:
  push:
    branches:
      - dev-py-fastapi-homework-5-ec2-deploy-task

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/py-fastapi-homework-5-ec2-deploy-task
            bash commands/deploy.sh