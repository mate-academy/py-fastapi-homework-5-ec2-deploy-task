services:
  web:
    build:
      context: .
      dockerfile: ./docker/tests/Dockerfile
    container_name: backend_theater_test
    command: [ "pytest", "-s", "-c", "/usr/src/config/pytest.ini",
               "-m", "e2e", "--maxfail=5", "--disable-warnings", "-v", "--tb=short"]
    environment:
      - PYTHONPATH=/usr/src/fastapi
      - ENVIRONMENT=testing
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - EMAIL_HOST=mailhog_theater_test
      - EMAIL_PORT=1025
      - EMAIL_HOST_USER=testuser@mate.com
      - EMAIL_HOST_PASSWORD=test_password
      - EMAIL_USE_TLS=False
      - MAILHOG_API_PORT=8025
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=some_password
      - MINIO_HOST=minio-theater-test
      - MINIO_PORT=9000
      - MINIO_STORAGE=theater-storage
    env_file:
      - .env
    depends_on:
      mailhog:
        condition: service_started
      minio:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio_mc:
        condition: service_healthy
    volumes:
      - ./src:/usr/src/fastapi
    networks:
      - theater_network_test

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog_theater_test
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - theater_network_test
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "8025" ]
      interval: 5s
      timeout: 2s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: minio-theater-test
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=some_password
      - MINIO_HOST=minio-theater-test
      - MINIO_PORT=9000
      - MINIO_STORAGE=theater-storage
    volumes:
      - minio_data_test:/data
    healthcheck:
      test: [ "CMD-SHELL", "bash -c ':> /dev/tcp/localhost/9000' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - theater_network_test

  minio_mc:
    build:
      context: .
      dockerfile: docker/minio_mc/Dockerfile
    container_name: minio_mc_theater_test
    command: [ "/bin/sh", "-c", "/commands/setup_minio.sh" ]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=some_password
      - MINIO_HOST=minio-theater-test
      - MINIO_PORT=9000
      - MINIO_STORAGE=theater-storage
    networks:
      - theater_network_test
    healthcheck:
      test: [ "CMD", "test", "-f", "/tmp/setup_done" ]
      interval: 5s
      timeout: 2s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    env_file:
      - .env
    ports:
      - "27017:27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - theater_network_test

volumes:
  minio_data_test:
    driver: local

networks:
  theater_network_test:
    driver: bridge
